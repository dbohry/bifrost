name: CI

# Switched off to save GitHub Actions minutes: it only runs when started by hand
# from the Actions tab. To turn it back on, put the triggers below back:
#   push:
#     branches: [main]
#   pull_request:
# Until then, run `make lint test size` before opening a pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo "gofmt: files above need formatting"; exit 1; fi
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Bundle size budget
        run: npm run size
