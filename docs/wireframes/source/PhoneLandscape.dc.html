<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; overflow: hidden; display: flex; flex-direction: column">
  <!-- slim top bar, padded for notch / safe area -->
  <header style="display: flex; align-items: center; gap: 12px; padding: 4px 44px; background: {{c.surface}}; border-bottom: 1px solid {{c.border}}">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px">
      <div style="width: 24px; height: 24px; border-radius: 7px; background: {{c.accent}}"></div>Bifrost
    </div>
    <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px; margin: 0 8px; border: 1px solid {{c.border}}; border-radius: 10px; background: {{c.bg}}; color: {{c.muted}}; font-size: 14px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Search apps or the web
    </label>
    <button aria-label="Add app" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 22px">+</button>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.text}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 12px 44px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <span style="flex-shrink: 0; height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 13px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</span>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="10">
        <a href="#" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px; padding: 12px; background: {{c.surface}}; border: 1px solid {{a.border}}; border-radius: 12px; min-height: 64px; box-sizing: border-box">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: {{c.iconBg}}; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: {{c.muted}}; flex-shrink: 0">{{a.l}}</div>
          <div style="min-width: 0">
            <div style="font-size: 13px; font-weight: 600">{{a.n}}</div>
            <div style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: {{c.muted}}"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{a.dot}}"></span>{{a.meta}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark","dracula","nord","gruvbox","solarizedDark","solarizedLight"]},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light:          { bg:'#f6f7f9', surface:'#ffffff', border:'#d5d9e0', text:'#1f2430', muted:'#5b6272', accent:'#3b5bdb', onAccent:'#ffffff', ok:'#2f9e63', bad:'#d9480f', iconBg:'#e3e6ec' },
      dark:           { bg:'#0f1117', surface:'#171a22', border:'#2a2f3c', text:'#e8eaf0', muted:'#9aa1b2', accent:'#7c93ff', onAccent:'#0f1117', ok:'#4cc38a', bad:'#ff7a59', iconBg:'#232836' },
      dracula:        { bg:'#282a36', surface:'#343746', border:'#44475a', text:'#f8f8f2', muted:'#a9b3d9', accent:'#bd93f9', onAccent:'#282a36', ok:'#50fa7b', bad:'#ff5555', iconBg:'#44475a' },
      nord:           { bg:'#2e3440', surface:'#3b4252', border:'#4c566a', text:'#eceff4', muted:'#b4bdcf', accent:'#88c0d0', onAccent:'#2e3440', ok:'#a3be8c', bad:'#e5808b', iconBg:'#434c5e' },
      gruvbox:        { bg:'#282828', surface:'#3c3836', border:'#504945', text:'#ebdbb2', muted:'#bdae93', accent:'#fabd2f', onAccent:'#282828', ok:'#b8bb26', bad:'#fb4934', iconBg:'#504945' },
      solarizedDark:  { bg:'#002b36', surface:'#073642', border:'#586e75', text:'#eee8d5', muted:'#93a1a1', accent:'#2aa198', onAccent:'#002b36', ok:'#859900', bad:'#f0645a', iconBg:'#094959' },
      solarizedLight: { bg:'#fdf6e3', surface:'#fffaf0', border:'#d6cdb3', text:'#073642', muted:'#586e75', accent:'#1f6fb0', onAccent:'#fdf6e3', ok:'#6b7d00', bad:'#c3261f', iconBg:'#eee8d5' }
    };
    const c = P[this.props.theme] || P.dark;
    const mk = (n, meta, up = true) => ({ n, l: n[0], meta, dot: up ? c.ok : c.bad, border: up ? c.border : c.bad });
    return {
      c,
      tabs: ['All', 'Media', 'Productivity', 'Network', 'Monitoring', 'Development'].map((label, i) => i === 0
        ? { label, bg: c.text, fg: c.bg, border: c.text }
        : { label, bg: c.surface, fg: c.text, border: c.border }),
      apps: [mk('Jellyfin', '3 streams'), mk('Nextcloud', 'online'), mk('Pi-hole', '18% blocked'), mk('Grafana', 'online'), mk('Portainer', '19 containers'),
             mk('Sonarr', '12 queued'), mk('Radarr', 'online'), mk('Paperless', '8 inbox'), mk('WireGuard', 'offline', false), mk('Gitea', 'online')]
    };
  }
}
</script>
</body>
</html>
