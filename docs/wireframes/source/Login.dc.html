<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px 16px">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="lg-tile" viewBox="0 0 96 96">
        <rect x="4" y="4" width="88" height="88" rx="22" fill="var(--tile)"/>
        <g fill="none" stroke="var(--glyph)" stroke-width="7" stroke-linecap="round"><path d="M20 63A28 28 0 0 1 76 63"/><path d="M33 63A15 15 0 0 1 63 63"/></g>
        <circle cx="48" cy="63" r="4.5" fill="var(--glyph)"/>
      </symbol>
    </defs>
  </svg>

  <main style="width: 100%; max-width: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 32px; background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <svg width="64" height="64" style="--tile: {{c.accent}}; --glyph: {{c.onAccent}}" role="img" aria-label="Bifrost"><use href="#lg-tile"></use></svg>
      <div>
        <h1 style="margin: 0; font-size: 22px">Sign in to Bifrost</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: {{c.muted}}">Your apps, one bridge away.</p>
      </div>
    </div>

    <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
      <div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid {{c.bad}}; border-radius: 10px; font-size: 13px; line-height: 1.4">
        <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: {{c.bad}}; color: {{c.onAccent}}; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0">!</span>
        Wrong username or password. Try again.
      </div>
    </sc-if>

    <form style="display: flex; flex-direction: column; gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Username
        <input type="text" value="{{user}}" autocomplete="username" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{fieldBorder}}; background: {{c.bg}}; color: {{c.text}}; font: inherit; font-size: 15px; font-weight: 400">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
        Password
        <span style="display: flex; align-items: center; height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{fieldBorder}}; background: {{c.bg}}">
          <input type="password" value="{{pass}}" autocomplete="current-password" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 14px; border: 0; background: transparent; color: {{c.text}}; font: inherit; font-size: 15px; font-weight: 400; outline: none">
          <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px">
        <input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: {{c.accent}}">
        Keep me signed in on this device
      </label>
      <button type="submit" style="height: 48px; border-radius: 10px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font: inherit; font-size: 15px; font-weight: 700">Sign in</button>
    </form>

  </main>

  <p style="margin: 0; font-size: 12px; color: {{c.muted}}; text-align: center">Bifrost v0.1</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark","dracula","nord","gruvbox","solarizedDark","solarizedLight"]},"state":{"editor":"enum","default":"default","options":["default","error"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light:          { bg:'#f6f7f9', surface:'#ffffff', border:'#d5d9e0', text:'#1f2430', muted:'#5b6272', accent:'#3b5bdb', onAccent:'#ffffff', ok:'#2f9e63', bad:'#d9480f', iconBg:'#e3e6ec' },
      dark:           { bg:'#0f1117', surface:'#171a22', border:'#2a2f3c', text:'#e8eaf0', muted:'#9aa1b2', accent:'#7c93ff', onAccent:'#0f1117', ok:'#4cc38a', bad:'#ff7a59', iconBg:'#232836' },
      dracula:        { bg:'#282a36', surface:'#343746', border:'#44475a', text:'#f8f8f2', muted:'#a9b3d9', accent:'#bd93f9', onAccent:'#282a36', ok:'#50fa7b', bad:'#ff5555', iconBg:'#44475a' },
      nord:           { bg:'#2e3440', surface:'#3b4252', border:'#4c566a', text:'#eceff4', muted:'#b4bdcf', accent:'#88c0d0', onAccent:'#2e3440', ok:'#a3be8c', bad:'#e5808b', iconBg:'#434c5e' },
      gruvbox:        { bg:'#282828', surface:'#3c3836', border:'#504945', text:'#ebdbb2', muted:'#bdae93', accent:'#fabd2f', onAccent:'#282828', ok:'#b8bb26', bad:'#fb4934', iconBg:'#504945' },
      solarizedDark:  { bg:'#002b36', surface:'#073642', border:'#586e75', text:'#eee8d5', muted:'#93a1a1', accent:'#2aa198', onAccent:'#002b36', ok:'#859900', bad:'#f0645a', iconBg:'#094959' },
      solarizedLight: { bg:'#fdf6e3', surface:'#fffaf0', border:'#d6cdb3', text:'#073642', muted:'#586e75', accent:'#1f6fb0', onAccent:'#fdf6e3', ok:'#6b7d00', bad:'#c3261f', iconBg:'#eee8d5' }
    };
    const c = P[this.props.theme] || P.light;
    const isError = this.props.state === 'error';
    return {
      c, isError,
      fieldBorder: isError ? c.bad : c.border,
      user: isError ? 'alex' : '',
      pass: isError ? 'wrongpassword' : ''
    };
  }
}
</script>
</body>
</html>
