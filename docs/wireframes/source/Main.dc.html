<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bifrost dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:#3b5bdb}a:hover{color:#2b44a8}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #f6f7f9; color: #1f2430; display: flex; flex-direction: column">
  <!-- top bar -->
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 32px; background: #ffffff; border-bottom: 1px solid #d5d9e0">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1f2430"></div>
      Bifrost
    </div>
    <label style="flex: 1 1 280px; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #c4c9d4; border-radius: 10px; background: #f6f7f9; color: #5b6272; font-size: 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6272" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="flex: 1">Search apps or the web</span>
      <span style="border: 1px solid #c4c9d4; border-radius: 5px; padding: 0 6px; font-size: 12px">/</span>
    </label>
    <div style="display: flex; align-items: center; gap: 8px">
      <button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #3b5bdb; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600">+ Add app</button>
      <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #c4c9d4; background: #ffffff">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f2430" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <div aria-label="User menu" role="img" style="width: 44px; height: 44px; border-radius: 22px; background: #d5d9e0; display: grid; place-items: center; font-size: 14px; font-weight: 600">D</div>
    </div>
  </header>

  <main style="width: 100%; max-width: 1120px; box-sizing: border-box; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 32px">
    <!-- greeting + tabs -->
    <div style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 26px">Good afternoon</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: #5b6272">12 apps · 11 online</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <button style="height: 36px; padding: 0 16px; border-radius: 18px; font: inherit; font-size: 14px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <!-- favourites -->
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #5b6272">Favourites</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px">
        <sc-for list="{{favs}}" as="a" hint-placeholder-count="5">
          <a href="#" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px 16px; background: #ffffff; border: 1px solid #d5d9e0; border-radius: 14px">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: #e3e6ec; display: grid; place-items: center; font-weight: 700; color: #5b6272">{{a.l}}</div>
            <div style="font-size: 14px; font-weight: 600">{{a.n}}</div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5b6272"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{a.dot}}"></span>{{a.meta}}</div>
          </a>
        </sc-for>
      </div>
    </section>

    <!-- all apps -->
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #5b6272">All apps</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px">
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="8">
          <a href="#" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px 16px; background: #ffffff; border: 1px solid #d5d9e0; border-radius: 14px">
            <div style="width: 52px; height: 52px; border-radius: 14px; background: #e3e6ec; display: grid; place-items: center; font-weight: 700; color: #5b6272">{{a.l}}</div>
            <div style="font-size: 14px; font-weight: 600">{{a.n}}</div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5b6272"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{a.dot}}"></span>{{a.meta}}</div>
          </a>
        </sc-for>
        <a href="AddPick.dc.html" style="text-decoration: none; color: #5b6272; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 140px; box-sizing: border-box; border: 2px dashed #b4bac7; border-radius: 14px; font-size: 14px">
          <span style="font-size: 26px; line-height: 1">+</span>Add app
        </a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = '#2f9e63', bad = '#d9480f';
    const mk = (n, meta, up = true) => ({ n, l: n[0], meta, dot: up ? ok : bad });
    const labels = ['All', 'Media', 'Productivity', 'Network', 'Monitoring'];
    return {
      tabs: labels.map((label, i) => i === 0
        ? { label, bg: '#1f2430', fg: '#ffffff', border: '#1f2430' }
        : { label, bg: '#ffffff', fg: '#1f2430', border: '#c4c9d4' }),
      favs: [mk('Jellyfin', '3 streams'), mk('Nextcloud', 'online'), mk('Pi-hole', '18% blocked'), mk('Grafana', 'online'), mk('Portainer', '19 containers')],
      apps: [
        mk('Jellyfin', '3 streams'), mk('Sonarr', '12 queued'), mk('Radarr', 'online'), mk('Nextcloud', 'online'),
        mk('Paperless', '8 in inbox'), mk('Vaultwarden', 'online'), mk('Pi-hole', '18% blocked'), mk('Traefik', '24 routes'),
        mk('WireGuard', 'offline', false), mk('Grafana', 'online'), mk('Uptime Kuma', '11 / 12 up'), mk('Gitea', 'online')
      ]
    };
  }
}
</script>
</body>
</html>
