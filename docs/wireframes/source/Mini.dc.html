<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theme preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</helmet>
<div style="width: 100%; height: 290px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; border: 1px solid {{c.border}}; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: {{c.surface}}; border-bottom: 1px solid {{c.border}}">
    <div style="width: 16px; height: 16px; border-radius: 5px; background: {{c.accent}}"></div>
    <div style="font-size: 12px; font-weight: 700">Bifrost</div>
    <div style="flex: 1; height: 22px; border-radius: 6px; border: 1px solid {{c.border}}; background: {{c.bg}}; margin: 0 8px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; color: {{c.muted}}">Search</div>
    <div style="height: 22px; padding: 0 10px; border-radius: 6px; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 10px; font-weight: 700; display: flex; align-items: center">+ Add</div>
  </div>
  <div style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 6px">
      <div style="height: 20px; padding: 0 10px; border-radius: 10px; background: {{c.text}}; color: {{c.bg}}; font-size: 10px; display: flex; align-items: center">All</div>
      <div style="height: 20px; padding: 0 10px; border-radius: 10px; border: 1px solid {{c.border}}; font-size: 10px; display: flex; align-items: center">Media</div>
      <div style="height: 20px; padding: 0 10px; border-radius: 10px; border: 1px solid {{c.border}}; font-size: 10px; display: flex; align-items: center">Network</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 8px">
          <div style="width: 26px; height: 26px; border-radius: 7px; background: {{c.iconBg}}; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: {{c.muted}}">{{t.l}}</div>
          <div style="font-size: 10px; font-weight: 600">{{t.n}}</div>
          <div style="display: flex; align-items: center; gap: 4px; font-size: 9px; color: {{c.muted}}"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.dot}}"></span>{{t.meta}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark","dracula","nord","gruvbox","solarizedDark","solarizedLight"]},"$preview":{"width":400,"height":290}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light:          { bg:'#f6f7f9', surface:'#ffffff', border:'#d5d9e0', text:'#1f2430', muted:'#5b6272', accent:'#3b5bdb', onAccent:'#ffffff', ok:'#2f9e63', bad:'#d9480f', iconBg:'#e3e6ec' },
      dark:           { bg:'#0f1117', surface:'#171a22', border:'#2a2f3c', text:'#e8eaf0', muted:'#9aa1b2', accent:'#7c93ff', onAccent:'#0f1117', ok:'#4cc38a', bad:'#ff7a59', iconBg:'#232836' },
      dracula:        { bg:'#282a36', surface:'#343746', border:'#44475a', text:'#f8f8f2', muted:'#a9b3d9', accent:'#bd93f9', onAccent:'#282a36', ok:'#50fa7b', bad:'#ff5555', iconBg:'#44475a' },
      nord:           { bg:'#2e3440', surface:'#3b4252', border:'#4c566a', text:'#eceff4', muted:'#b4bdcf', accent:'#88c0d0', onAccent:'#2e3440', ok:'#a3be8c', bad:'#e5808b', iconBg:'#434c5e' },
      gruvbox:        { bg:'#282828', surface:'#3c3836', border:'#504945', text:'#ebdbb2', muted:'#bdae93', accent:'#fabd2f', onAccent:'#282828', ok:'#b8bb26', bad:'#fb4934', iconBg:'#504945' },
      solarizedDark:  { bg:'#002b36', surface:'#073642', border:'#586e75', text:'#eee8d5', muted:'#93a1a1', accent:'#2aa198', onAccent:'#002b36', ok:'#859900', bad:'#f0645a', iconBg:'#094959' },
      solarizedLight: { bg:'#fdf6e3', surface:'#fffaf0', border:'#d6cdb3', text:'#073642', muted:'#586e75', accent:'#1f6fb0', onAccent:'#fdf6e3', ok:'#6b7d00', bad:'#c3261f', iconBg:'#eee8d5' }
    };
    const c = P[this.props.theme] || P.dark;
    const t = (n, meta, up = true) => ({ n, l: n[0], meta, dot: up ? c.ok : c.bad });
    return {
      c,
      tiles: [t('Jellyfin','3 streams'), t('Nextcloud','online'), t('Pi-hole','18% blocked'), t('Grafana','online'),
              t('Sonarr','12 queued'), t('Gitea','online'), t('WireGuard','offline',false), t('Traefik','24 routes')]
    };
  }
}
</script>
</body>
</html>
