<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theme gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #f6f7f9; color: #1f2430; padding: 40px 32px 64px">
  <div style="max-width: 1216px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
    <div>
      <h1 style="margin: 0; font-size: 24px">Bundled themes</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5b6272">Same layout, only the palette changes. Each theme is a small set of colour tokens.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="light" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Bifrost Light <span style="font-weight: 400; color: #5b6272">· default</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="dark" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Bifrost Dark <span style="font-weight: 400; color: #5b6272">· default dark</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="dracula" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Dracula</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="nord" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Nord</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="gruvbox" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Gruvbox Dark</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="solarizedDark" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Solarized Dark</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="Mini" theme="solarizedLight" hint-size="100%,290px"></dc-import>
        <div style="font-size: 14px; font-weight: 600">Solarized Light</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 290px; box-sizing: border-box; border: 2px dashed #b4bac7; border-radius: 12px; color: #5b6272; font-size: 14px; text-align: center; padding: 16px">
        <span style="font-size: 26px; line-height: 1">+</span>Your theme
        <span style="font-size: 12px">Drop a theme file in /themes</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
